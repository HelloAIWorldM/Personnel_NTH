  <circle cx="40" cy="26" r="2.2" fill="#2B1810" />
  <circle cx="39.5" cy="25.5" r="0.7" fill="#FFF" />

  <!-- Pink Muzzle with Nostrils -->
  <ellipse cx="32" cy="38" rx="11" ry="7.5" fill="#FFBCC6" stroke="#2B1810" stroke-width="2.4" />
  <circle cx="28.5" cy="38" r="1.4" fill="#2B1810" />
  <circle cx="35.5" cy="38" r="1.4" fill="#2B1810" />

  <!-- Tiny Heart Charm -->
  <path d="M48 46 C48 43 51 42 53 44 C55 42 58 43 58 46 C58 50 53 53 53 53 C53 53 48 50 48 46 Z" fill="#FF8FA3" stroke="#2B1810" stroke-width="1.5" />
